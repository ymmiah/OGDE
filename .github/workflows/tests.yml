name: Security and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run tests and write JUnit results
        run: python scripts/run_tests_junit.py --output test-results/unittest.xml
      - name: Upload test report (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ogde-unittest-report
          path: test-results/unittest.xml
          if-no-files-found: warn
          retention-days: 14
      - run: python -m compileall -q src
