name: Deploy OGDE Website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: bash site/prepare-publish.sh
      - name: Check generated website
        run: |
          test -s site/public/index.html
          test -s site/public/styles.css
          test -s site/public/assets/brand/ogde-icon.svg
          test -f site/public/.nojekyll
          test -f site/public/CNAME
          grep -q 'assets/brand/ogde-logo.svg' site/public/index.html
          grep -q 'ogde inventory' site/public/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
