name: Scheduled defensive verification
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify federated synthetic demonstration
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          ogde keygen --private "$d/pem" --public "$d/pub"
          python scripts/create_demo_feed.py --out "$d/feed.json"
          ogde sign --feed "$d/feed.json" --private "$d/pem" --out "$d/signed.json"
          ogde trust-add --registry "$d/trust.json" --publisher-id ogde-lab --feed-id lab-advisories --public "$d/pub" --confirm-trust-anchor
          ogde assess --registry "$d/trust.json" --feed "$d/signed.json" --sbom examples/sbom.v2-demo.cdx.json --context examples/asset-context.example.json --state "$d/state.json" --out "$d/result.json" --fail-on none
          python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["finding_count"] == 1 and r["findings"][0]["decision"] == "human-review"' "$d/result.json"
