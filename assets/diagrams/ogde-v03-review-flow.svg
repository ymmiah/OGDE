<rect x="115" y="814" width="325" height="36" fill="#fff"/><text x="277" y="837" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Stale, inconsistent or invalid</text>
<rect x="755" y="814" width="300" height="36" fill="#fff"/><text x="905" y="837" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#333">Reviewable evidence</text>
