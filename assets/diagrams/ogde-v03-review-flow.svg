<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1310" role="img" aria-labelledby="title desc">
<title id="title">OGDE v0.3 local intelligence review workflow</title>
<desc id="desc">A local intelligence snapshot passes evidence checks, freshness assessment and reconciliation. Local inventory joins at the finding contract. Policy checks branch to human investigation for invalid evidence or to a prioritised report for reviewable evidence. Both require human approval before any owner-controlled response.</desc>
<rect width="1240" height="1310" fill="#fff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#555"/></marker></defs>
<text x="620" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#181818">OGDE — Verified intelligence review</text>
