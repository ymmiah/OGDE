<g id="J"><rect x="400" y="1040" width="440" height="86" rx="8" fill="#f2f2f2" stroke="#303030" stroke-width="2" /><text x="620" y="1083" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#181818"><tspan x="620" dy="0">Human approval / decision</tspan></text></g>
<g id="K"><rect x="400" y="1170" width="440" height="92" rx="8" fill="#fff" stroke="#303030" stroke-width="1.5" /><text x="620" y="1204" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#181818"><tspan x="620" dy="0">Owner-controlled response</tspan><tspan x="620" dy="25">Outside this automated pipeline</tspan></text></g>
<text x="620" y="1294" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#555">Read-only assessment · Human-governed response · Not a production security certification</text>
